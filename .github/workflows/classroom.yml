          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/bible.txt tests/commands10.txt output.txt && cmp output.txt tests/out10.txt"
          timeout: 1
          max-score: 1
      - name: Test 11
        id: test-11
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 11 (b.t.)
          setup-command: ''
          command: "timeout 2 ./build/copypaste tests/bible.txt tests/commands11.txt output.txt && cmp output.txt tests/out11.txt"
          timeout: 1
          max-score: 1
      - name: Test 12
        id: test-12
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 12 (b.t.)
          setup-command: ''
          command: "timeout 2 ./build/copypaste tests/bible.txt tests/commands12.txt output.txt && cmp output.txt tests/out12.txt"
          timeout: 1
          max-score: 1
      - name: Test 13
        id: test-13
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 13 (b.t.)
          setup-command: ''
          command: "timeout 2 ./build/copypaste tests/alice29.txt tests/commands13.txt output.txt && cmp output.txt tests/out13.txt"
          timeout: 1
          max-score: 1
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TEST-1_RESULTS: "${{steps.test-1.outputs.result}}"
          TEST-2_RESULTS: "${{steps.test-2.outputs.result}}"
          TEST-3_RESULTS: "${{steps.test-3.outputs.result}}"
          TEST-4_RESULTS: "${{steps.test-4.outputs.result}}"
          TEST-5_RESULTS: "${{steps.test-5.outputs.result}}"
          TEST-6_RESULTS: "${{steps.test-6.outputs.result}}"
          TEST-7_RESULTS: "${{steps.test-7.outputs.result}}"
          TEST-8_RESULTS: "${{steps.test-8.outputs.result}}"
          TEST-9_RESULTS: "${{steps.test-9.outputs.result}}"
          TEST-10_RESULTS: "${{steps.test-10.outputs.result}}"
          TEST-11_RESULTS: "${{steps.test-11.outputs.result}}"
          TEST-12_RESULTS: "${{steps.test-12.outputs.result}}"
          TEST-13_RESULTS: "${{steps.test-13.outputs.result}}"
        with:
          runners: test-1,test-2,test-3,test-4,test-5,test-6,test-7,test-8,test-9,test-10,test-11,test-12,test-13
      - name: Memory leaks
        run: |
             valgrind --tool=memcheck --leak-check=full --undef-value-errors=no --error-exitcode=111 ./build/copypaste tests/alice29.txt tests/commands13.txt output.txt
      - name: Checkout
        uses: actions/checkout@v4
      - name: CPD
        uses: amcp-pit/cpd-action@v1
        id: cpd
        with:
          repository: ${{ github.repository }}
          collection: ${{ github.repository_owner  }}
      - name: Clean
        run: |
             rm -rf ./* || true
             rm -rf ./.??* || true