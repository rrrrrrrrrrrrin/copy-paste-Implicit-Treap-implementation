name: GitHub Classroom Workflow

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*'
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  Checking-Solution:
    runs-on: gtest
    timeout-minutes: 3
    steps:
      - name: Get repository code
        uses: actions/checkout@v4
      - name: Normalize shell scripts line endings & permissions
        run: |
          # convert CRLF -> LF for all .sh files in the repo copy
          find . -type f -name '*.sh' -exec sed -i 's/\r$//' {} + || true
          # make sure the scripts are executable
          find . -type f -name '*.sh' -exec chmod +x {} + || true  
      - name: Check repository clean
        run: bash ./scripts/check_clean.sh
      - name: Check requirements
        run: |
             !(grep -qwRE --include=*.{cc,cpp,h,hpp} '<vector>|<list>|<string>|<algorithm>|<stack>|<queue>|<deque>|<set>|<map>|<bits' ./* ) &&  (echo \"Check - OK\" )  || ( echo \"Forbiden STL containers\" && exit 9 )
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y clang-format cmake cppcheck valgrind
      - name: Check code style
        run: |
             clang-format --version
             find "." \( -name '*.cpp' -o -name '*.h*' \) -print0 | xargs -0 clang-format --dry-run --Werror --verbose
      - name: Clean previous CMake cache
        run: |
          rm -rf build
      - name: Code linting
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cppcheck --enable=all --inconclusive --std=c++20 -i build .
      - name: Build
        run: bash ./scripts/build.sh
      - name: Extract tests
        run: |
          unzip -q tests/tests.zip -d tests
          find tests -type f -exec sed -i 's/\r$//' {} +  
      - name: Test 1
        id: test-1
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 1
          command: "timeout 1 ./build/copypaste tests/text1.txt tests/commands1.txt output.txt && cmp output.txt tests/out1.txt"
          timeout: 1
          max-score: 1
      - name: Test 2
        id: test-2
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 2
          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/text2.txt tests/commands2.txt output.txt && cmp output.txt tests/out2.txt"
          timeout: 1
          max-score: 1
      - name: Test 3
        id: test-3
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 3
          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/text3.txt tests/commands3.txt output.txt && cmp output.txt tests/out3.txt"
          timeout: 1
          max-score: 1
      - name: Test 4
        id: test-4
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 4
          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/text4.txt tests/commands4.txt output.txt && cmp output.txt tests/out4.txt"
          timeout: 1
          max-score: 1
      - name: Test 5
        id: test-5
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 5
          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/text4.txt tests/commands5.txt output.txt && cmp output.txt tests/out5.txt"
          timeout: 1
          max-score: 1
      - name: Test 6
        id: test-6
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 6
          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/text4.txt tests/commands6.txt output.txt && cmp output.txt tests/out6.txt"
          timeout: 1
          max-score: 1
      - name: Test 7
        id: test-7
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 7
          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/text4.txt tests/commands7.txt output.txt && cmp output.txt tests/out7.txt"
          timeout: 1
          max-score: 1
      - name: Test 8
        id: test-8
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 8
          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/text4.txt tests/commands8.txt output.txt && cmp output.txt tests/out8.txt"
          timeout: 1
          max-score: 1
      - name: Test 9
        id: test-9
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test 9
          setup-command: ''
          command: "timeout 1 ./build/copypaste tests/text4.txt tests/commands9.txt output.txt && cmp output.txt tests/out9.txt"
